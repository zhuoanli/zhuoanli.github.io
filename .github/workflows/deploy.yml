name: Deploy to GitHub Pages

on:
  # Publishing is manual on purpose while the repo is private and the content
  # is still placeholder. Two things to know before flipping this on:
  #
  #   1. GitHub Pages cannot publish from a private repo on the free plan —
  #      the configure-pages step below will fail. Pro or a public repo.
  #   2. A private repo does not make a private site. Pages published from a
  #      private repo is still publicly reachable; only Enterprise can put
  #      access control in front of it.
  #
  # So: keep the repo private and leave this commented out. When the content is
  # ready, make the repo public and uncomment.
  #
  # push:
  #   branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement:true turns Pages on for the repo on the first run, so there
      # is no Settings toggle to remember.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
