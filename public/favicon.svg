<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Black cat working behind a laptop</title>
  <desc id="desc">
    A large curious black cat peeks over a slightly trapezoid laptop on a transparent background.
  </desc>

  <!-- 桌面线 -->
  <path d="M2.2 22.7h4.2m21.1 0h2.3"
        fill="none"
        stroke="#111214"
        stroke-width="1.55"
        stroke-linecap="round"/>

  <!-- 黑猫 -->
  <path d="M5.5 22.7
           c-.5-1.48-.2-2.88.93-4.02
           -1.04-.94-1.56-2.34-1.42-4.03
           .18-2.24 1.32-4.01 3.18-5.08
           l.84-3.27
           c.12-.49.71-.67 1.07-.33
           l2.35 2.23
           a11.7 11.7 0 0 1 6.44 0
           l2.35-2.23
           c.36-.34.95-.16 1.07.33
           l.84 3.27
           c1.86 1.07 3 2.84 3.18 5.08
           .14 1.69-.38 3.09-1.42 4.03
           1.13 1.14 1.18 2.54.68 4.02
           H5.5Z"
        fill="#111214"/>

  <!-- 眼睛 -->
  <circle cx="11.45"
          cy="15.25"
          r="1.25"
          fill="#F7F5EF"/>

  <circle cx="19.85"
          cy="15.25"
          r="1.25"
          fill="#F7F5EF"/>

  <!-- 猫爪 -->
  <path d="M14.55 22.15
           c-1.58-.02-2.76.06-3.8.19
           -.4.05-.51.57-.18.8
           l2.9 1.95
           c.51.35 1.18.09 1.34-.5
           l.5-1.82"
        fill="#F7F5EF"
        stroke="#111214"
        stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- 轻微梯形的笔记本电脑 -->
  <path d="M14.05 17.75
           h13.5
           l-.72 9.25
           H14.77
           l-.72-9.25Z"
        fill="#F7F5EF"
        stroke="#111214"
        stroke-width="1.55"
        stroke-linejoin="round"/>

  <!-- 电脑底边 -->
  <path d="M14.75 27h12.1"
        fill="none"
        stroke="#111214"
        stroke-width="1.55"
        stroke-linecap="round"/>

</svg>